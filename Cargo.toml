[workspace]
resolver = "2"
members = [
  ## Binaries
  # Command line entrypoint.
  "amarotherum",
  "amarotherum_core",
  "amarotherum_error",
  # Local fork of servoshell because we need to use private structs
  # "servoshell",
]


[workspace.package]
version = "0.0.1"
authors = ["The Servo Project Developers + amarotherum developers"]
license = "GPL-2.0"
edition = "2024"
publish = false

[workspace.dependencies]

thiserror = "2.0.12"
miette = "7.2.0"
tracing = "0.1.41"
log = "0.4.22"
env_logger = "0.11.5"

bon = "3.5.1"
tokio = { version = "1.40.0", features = ["full"] }

## Webview
# iced_webview_v2 = "0.1"
# iced_webview_v2 = { git = "https://github.com/franzos/iced_webview_v2.git", branch = "main", default-features = false, features = [
#   "servo",
# ] } # or "blitz" or "servo", "cef"
raw-window-handle = { version = "0.6.2" }
dpi = { version = "0.1.2" }

## GUI
# Iced
winit = { version = "0.30.13" }
# iced = { version = "0.14.0", features = ["advanced", "image", "tokio", "lazy"] }
iced_winit = { git = "https://github.com/iced-rs/iced.git", branch = "master" }
iced = { git = "https://github.com/iced-rs/iced.git", branch = "master", features = [
  "advanced",
  "image",
  "tokio",
  "linux-theme-detection",
  "image-without-codecs",
] }

# Bevy
# bevy = { version = "0.19.1", features = [
#   "bevy_ui",
#   "ui",
#   "bevy_ui_widgets",
#   "bevy_ui_debug",
#
#   "bevy_window",
#   "bevy_winit",
#
#   # Deprecated: For passing window/display handle to servo
#   # "alloc",
# ] }

# servo-wgpu-interop-adapter = { git = "https://github.com/merely-made/wgpu-graft", features = [
# "servo",
# ], branch = "main" }

## Browser
# libservo = { git = "https://github.com/servo/servo", branch = "main" }
# servo = { git = "https://github.com/servo/servo", branch = "main" }
servo = { git = "https://github.com/servo/servo", tag = "v0.7.0" }
# servo = { git = "https://github.com/servo/servo", tag = "v0.1.3" }

## Servo dependencies

# rsa = { version = "0.10.0-rc.19" }
# icu_normalizer = "2.1.0"
# icu_capi = "=2.1.1"

# libservo = { git = "https://github.com/servo/servo", tag = "v0.0.4" }
# servo = { git = "https://github.com/servo/servo", tag = "v0.0.4" }
# servoshell = { git = "https://github.com/servo/servo", tag = "v0.0.4" }
# servoshell = { path = "./servoshell/" }

serde = { version = "1.0.210", features = ["derive"] }
serde_json = { version = "1.0.128", features = ["preserve_order"] }
toml = "1.1.6"

