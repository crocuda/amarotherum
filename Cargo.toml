[workspace]
resolver = "2"
members = [
  ## Binaries
  # Command line entrypoint.
  "amarotherum",
  "amarotherum_core",
  "amarotherum_error",
  # Local fork of servoshell because we need to use private structs
  # "servoshell",
]

[workspace.dependencies]

thiserror = "2.0.12"
miette = "7.2.0"
anyhow = "1.0.104"
tracing = "0.1.41"
log = "0.4.22"
env_logger = "0.11.5"

bon = "3.5.1"
tokio = { version = "1.40.0", features = ["full"] }
futures = { version = "0.3.34" }

## GUI
# Iced
raw-window-handle = { version = "0.6.2" }
dpi = { version = "0.1.2" }

# Compat deps
# winit = { version = "0.30.13", features = ["rwh_06"] }
arboard = { version = "3.6", default-features = false }
web-sys = "0.3.104"
wasm-bindgen-futures = "0.4"
mundy = { version = "0.2", default-features = false }

# Latest version with features
iced = { git = "https://github.com/iced-rs/iced.git", branch = "master", features = [
  "advanced",
  "tokio",
  "linux-theme-detection",
  "image",
  # "image-without-codecs",
  "tiny-skia",
] }
iced_winit = { git = "https://github.com/iced-rs/iced.git", branch = "master", features = [
  # 0.15.0
  "image",
] }
iced_wgpu = { git = "https://github.com/iced-rs/iced.git", branch = "master", features = [
  "image",
  # "image-without-codecs",
] }
iced_renderer = { git = "https://github.com/iced-rs/iced.git", branch = "master", features = [
  "image",
  # "image-without-codecs",
] }
iced_graphics = { git = "https://github.com/iced-rs/iced.git", branch = "master", features = [
  "image",
  # "image-without-codecs",
] }
iced_futures = { git = "https://github.com/iced-rs/iced.git", branch = "master" }
iced_debug = { git = "https://github.com/iced-rs/iced.git", branch = "master" }
# iced_program = { git = "https://github.com/iced-rs/iced.git", branch = "master" }
iced_runtime = { git = "https://github.com/iced-rs/iced.git", branch = "master" }
iced_core = { git = "https://github.com/iced-rs/iced.git", branch = "master" }
rustc-hash = "2.1.3"
sysinfo = "0.33"

## Browser

image = { version = "0.25.10", features = ["default", "default-formats"] }
servo = { git = "https://github.com/servo/servo", tag = "v0.7.0" }

serde = { version = "1.0.210", features = ["derive"] }
serde_json = { version = "1.0.128", features = ["preserve_order"] }
toml = "1.1.6"

# rustls = { version = "*", features = ["aws-lc-rs"] }

